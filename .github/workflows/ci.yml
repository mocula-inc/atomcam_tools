name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    # ドキュメントだけの変更では動かさない。サブディレクトリの .md（initramfs_skeleton/README.md など）は
    # ファームウェアに入るので、除外するのは直下の .md と docs/ だけ
    paths-ignore:
      - "*.md"
      - docs/**

permissions:
  contents: read

jobs:
  version:
    name: Firmware version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # マージ先との分岐点を求めるために全履歴を取る
          fetch-depth: 0
      - name: Check configs/mocula.ver
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./buildscripts/check_firmware_version.sh "origin/$BASE_REF"
